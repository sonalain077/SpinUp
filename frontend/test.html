<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test de Connectivité Backend</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        .info { background-color: #d1ecf1; color: #0c5460; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🔧 Test de Connectivité Backend</h1>
    
    <div>
        <button onclick="testPing()">Test Ping</button>
        <button onclick="testStatus()">Test Status</button>
        <button onclick="testReservation()">Test Réservation</button>
        <button onclick="clearResults()">Effacer</button>
    </div>
    
    <div id="results"></div>

    <script>
        const baseURL = 'http://localhost:8081/api/parking';
        
        function addResult(message, type = 'info') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong>: ${message}`;
            results.appendChild(div);
        }
        
        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }
        
        async function testPing() {
            addResult('Test de ping en cours...', 'info');
            try {
                const response = await fetch(`${baseURL}/ping`);
                const text = await response.text();
                addResult(`✅ Ping réussi: ${response.status} - ${text}`, 'success');
            } catch (error) {
                addResult(`❌ Erreur ping: ${error.message}`, 'error');
                console.error('Erreur ping:', error);
            }
        }
        
        async function testStatus() {
            addResult('Test de status en cours...', 'info');
            try {
                const response = await fetch(`${baseURL}/status`);
                const text = await response.text();
                addResult(`✅ Status réussi: ${response.status} - ${text}`, 'success');
            } catch (error) {
                addResult(`❌ Erreur status: ${error.message}`, 'error');
                console.error('Erreur status:', error);
            }
        }
        
        async function testReservation() {
            addResult('Test de réservation en cours...', 'info');
            
            const testData = {
                licencePlate: "AB-123-CD",
                startAt: "2025-09-30T15:00:00",
                durationMinutes: 60,
                address: "Parking Test",
                paymentToken: "demo"
            };
            
            try {
                const response = await fetch(`${baseURL}/reserve`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(testData)
                });
                
                const result = await response.json();
                addResult(`✅ Réservation réussie: ${response.status} - ${JSON.stringify(result)}`, 'success');
            } catch (error) {
                addResult(`❌ Erreur réservation: ${error.message}`, 'error');
                console.error('Erreur réservation:', error);
            }
        }
        
        // Test automatique au chargement
        window.addEventListener('load', () => {
            addResult('Page de test chargée', 'info');
            setTimeout(testPing, 1000);
        });
    </script>
</body>
</html>
