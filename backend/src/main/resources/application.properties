server.port=8081

# Encodage UTF-8 (sans forcer de manière stricte)
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
spring.jackson.deserialization.ADJUST_DATES_TO_CONTEXT_TIME_ZONE=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.mvc.format.date-time=yyyy-MM-dd'T'HH:mm:ss

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/spinup}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:spinup}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:spinup}

# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true

# Charger les données de test au démarrage (seulement si DB vide)
spring.sql.init.mode=always

# If using Postgres, override via env:
# SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/parkandsee
# SPRING_DATASOURCE_USERNAME=postgres
# SPRING_DATASOURCE_PASSWORD=example
# SPRING_DATASOURCE_DRIVER=org.postgresql.Driver

# Demo JWT settings - replace in production with secure secret from env
jwt.secret=change_this_demo_secret_to_a_secure_value_very_long
jwt.expiration-ms=3600000

