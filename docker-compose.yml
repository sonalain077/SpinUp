version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: spinup
      POSTGRES_USER: spinup
      POSTGRES_PASSWORD: spinup
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/spinup
      SPRING_DATASOURCE_USERNAME: spinup
      SPRING_DATASOURCE_PASSWORD: spinup
    ports:
      - "8080:8081"

  frontend:
    build: ./frontend-react
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  db_data:
