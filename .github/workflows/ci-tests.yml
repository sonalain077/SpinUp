name: CI/CD - Tests Unitaires

on:
  push:
    branches: [ main, feature/**, feat/** ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Tests Backend (Java/Spring Boot)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout du code
      uses: actions/checkout@v4

    - name: Configuration JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Compilation du backend
      run: |
        cd backend
        mvn clean compile -q

    - name: Exécution des tests unitaires
      run: |
        cd backend
        mvn test

    - name: Génération du rapport de couverture
      run: |
        cd backend
        mvn jacoco:report

    - name: Upload rapport de tests
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-reports
        path: backend/target/surefire-reports/

    - name: Upload rapport de couverture
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report
        path: backend/target/site/jacoco/

    - name: Résumé des tests
      if: always()
      run: |
        cd backend
        echo "## 📊 Résultats des Tests Backend" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -f target/surefire-reports/*.xml ]; then
          echo "✅ Tests exécutés avec succès" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Erreur lors de l'exécution des tests" >> $GITHUB_STEP_SUMMARY
        fi

  frontend-tests:
    name: Tests Frontend (React)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout du code
      uses: actions/checkout@v4

    - name: Configuration Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend-react/package-lock.json

    - name: Installation des dépendances
      run: |
        cd frontend-react
        npm ci

    - name: Lint du code
      run: |
        cd frontend-react
        npm run lint --if-present || echo "Pas de configuration lint"

    - name: Build du frontend
      run: |
        cd frontend-react
        npm run build

    - name: Résumé du build frontend
      if: always()
      run: |
        echo "## 🎨 Build Frontend" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ Build réussi" >> $GITHUB_STEP_SUMMARY

  quality-check:
    name: Vérification de la qualité du code
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    steps:
    - name: Checkout du code
      uses: actions/checkout@v4

    - name: Résumé final
      run: |
        echo "## ✅ Pipeline CI/CD terminé" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Tous les tests sont passés avec succès!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📈 Prochaines étapes" >> $GITHUB_STEP_SUMMARY
        echo "- Vérifier les rapports de couverture" >> $GITHUB_STEP_SUMMARY
        echo "- Analyser les éventuels warnings" >> $GITHUB_STEP_SUMMARY
        echo "- Prêt pour le merge!" >> $GITHUB_STEP_SUMMARY
